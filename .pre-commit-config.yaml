# See CONTRIBUTING.md for instructions.
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# The commit message hook runs in the commit-msg stage, and the other hooks
# must not run on commit messages. `pre-commit install` installs both stages.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
# Use a slightly older version of node by default
# as the default uses a very new version of GLIBC
default_language_version:
  node: 16.18.0
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
        # A throwaway self-signed certificate and key for the TLS tests.
        exclude: ^tools/dev_tool/test/tls_fixture\.dart$
      - id: end-of-file-fixer
        # `flutter create` output is kept as generated.
        exclude: ^e2e/[^/]+/(android|ios|linux|macos|web|windows)/
      - id: trailing-whitespace
        # A patch's blank context lines are a single space; stripping it
        # stops the hunk from applying.
        exclude: \.patch$
  # Check formatting and lint for starlark code
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.3
    hooks:
      - id: buildifier
      - id: buildifier-lint
  # The commit policy in AGENTS.md: a conventional-commit subject, and a
  # `Changelog:` trailer on user-visible commits.
  - repo: local
    hooks:
      - id: commit-message
        name: commit message policy
        entry: bazel run --noshow_progress //tools/changelog:check --
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.0
    hooks:
      - id: typos
