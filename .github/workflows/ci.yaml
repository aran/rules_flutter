  web-smoke:
    name: Web smoke (DWDS VM service)
    runs-on: ubuntu-latest
    # Cold, this downloads the Flutter SDK, the engine artifacts and the web
    # SDK, then AOT-compiles the dev tool before the run itself starts.
    timeout-minutes: 60
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
