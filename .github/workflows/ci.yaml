          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key == env.DISK_CACHE_KEY and .ref == env.REF) | .id' || true)
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: github.event_name == 'push' && github.ref_type != 'tag' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  # Fails when an e2e module's MODULE.bazel is in no workflow without a
  # one-line reason recorded in tools/check_e2e_coverage: removing a
  # workspace from every shard without saying why turns this red.
  e2e-coverage:
    name: E2E coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Repository cache only (shared per OS, no disk-cache shard): this job
      # builds one tiny Dart tool, so it restores what ci.yaml saves and
      # never writes, like commit-messages.yaml.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Check every e2e module is covered or reasoned
        run: bazel run //tools/check_e2e_coverage
  conclusion:
    name: Conclusion
    needs: [e2e-macos-apple, e2e-macos-toolchain, unit-tests, e2e-linux-app, e2e-linux-small, e2e-linux-examples, e2e-linux-integration, e2e-windows, e2e-coverage, dart-tool-tests, pre-commit, web-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any job failed
        run: echo '${{ toJSON(needs) }}' | jq -e 'with_entries(select(.value.result != "success" and .value.result != "skipped")) | length == 0'
