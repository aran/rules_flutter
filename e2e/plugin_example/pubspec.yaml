name: plugin_example
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  audio_session: ^0.1.0
  # Android-only federated implementation, depended on directly (no
  # umbrella): regression case for a plugin that ships android/ resources
  # (R.drawable.ic_mic) and declares no Gradle dependencies at all.
  record_android: 1.5.1
  # A `path` package with no Bazel build, which the lock's
  # `build_from_pubspec` builds from its pubspec.
  kotlin_only_plugin:
    path: path_packages/kotlin_only_plugin
  # A Dart package with no Flutter of its own that depends on
  # `kotlin_only_plugin`: an app reaching the plugin only through it still has it.
  kotlin_plugin_user:
    path: path_packages/kotlin_plugin_user
  # A `path` package whose Gradle build declares only a version catalog entry,
  # which MODULE.bazel's `flutter_pub.annotation` supplies the artifact of.
  annotated_plugin:
    path: path_packages/annotated_plugin
  # A `path` package in Java whose Gradle build declares Java 17, the level
  # its sources need.
  java17_plugin:
    path: path_packages/java17_plugin
  geolocator_apple: 2.4.3
  # FlutterFire: a BoM whose version comes from firebase_core's
  # gradle.properties through a function of its build, versionless artifacts,
  # a project dependency of cloud_firestore on firebase_core, and BuildConfig
  # fields, LIBRARY_VERSION among them, set from each plugin's pubspec.
  firebase_core: 5.1.0
  cloud_firestore: 7.2.0
dev_dependencies:
  # A `path` package only a tool run outside Bazel uses, which the lock's
  # `ignored` keeps out of every Bazel build.
  pub_only_tool:
    path: path_packages/pub_only_tool
  very_good_analysis: ^10.3.0
  integration_test:
    sdk: flutter
